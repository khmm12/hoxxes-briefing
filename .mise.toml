[tools]
node = "24"
rust = { version = "1.98.1", profile = "minimal", components = "rustfmt,clippy", targets = "wasm32-unknown-unknown" }
"cargo:wasm-pack" = { version = "0.15.0", locked = true }
"cargo:wasm-bindgen-cli" = { version = "0.2.128", locked = true }
"cargo:cargo-llvm-cov" = { version = "0.9.0", locked = true }
"npm:vercel" = "59.11.2"

[tasks.pre-commit]
description = "Re-extract the web i18n catalog when staged changes touch apps/web/"
run = '''
#!/bin/sh
set -eu

if ! git diff --cached --name-only | grep -q '^apps/web/'; then
  exit 0
fi

(cd apps/web && pnpm exec lingui extract --clean)
git add apps/web/src/shared/i18n/locales/*/messages.po
'''

[tasks.sweep-generator-seeds]
description = "Exhaustively check generator seeds in pseudo-random order"
dir = "{{ config_root }}/crates/drg_mission_gen_facade"
run = "cargo run --release --example sweep_generator_seeds"
