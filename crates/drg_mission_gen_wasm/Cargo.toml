[package]
name = "drg_mission_gen_wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.128"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
drg_mission_gen_facade = { path = "../drg_mission_gen_facade" }
talc = "5.1.0"
tsify = "0.5.8"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
serde_json = "1.0"

[[bench]]
name = "bench"
harness = false
