    <!-- Paint the dark canvas before the external CSS bundle loads, so launching
         the installed PWA (or any first paint) does not flash white. Mirrors the
         `bg` token (neutral.950) and the manifest background_color — keep in sync. -->

         kept: the apple flag is what gates the standalone web-app path the apple-touch-startup-image
