name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Setup Rust toolchain
        uses: jdx/mise-action@v3
        env:
          MISE_ENABLE_TOOLS: rust
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2.9.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm check

  wasm-codegen:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup WASM toolchain
        uses: jdx/mise-action@v3
        env:
          MISE_ENABLE_TOOLS: rust,cargo:wasm-pack,cargo:wasm-bindgen-cli
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2.9.1
      - name: Regenerate WASM package
        run: ./scripts/codegen-wasm.sh
      - name: Verify generated package is committed
        run: >-
          git diff --exit-code --
          crates/drg_mission_gen_wasm/pkg
          ':(exclude)crates/drg_mission_gen_wasm/pkg/drg_mission_gen_wasm_bg.wasm'
